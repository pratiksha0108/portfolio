name: Portfolio checks

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check hero motion and opacity
        run: npm run test:hero

      - name: Build static export
        run: npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static
          path: out
          if-no-files-found: error
